name: Render Keep Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from spinning down
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping VexorQ Live Service
        run: |
          curl -sS -f --max-time 30 https://vexorq.onrender.com/api/healthz || true
